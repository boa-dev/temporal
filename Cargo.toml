[workspace]
resolver = "2"
members = [
    "crates/*",

    # Tools
    "tools/*",
]

[workspace.package]
edition = "2021"
version = "0.2.6"
rust-version = "1.95.0"
authors = ["boa-dev"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/boa-dev/temporal"
readme = "./README.md"
exclude = [
    "docs/*",
    ".github/*",
    "debug/",
    ".gitignore",
    "CONTRIBUTING.md",
    "cliff.toml",
    "tests/data/zoneinfo64.res",
]

[workspace.dependencies]
# Self
temporal = { version = "0.2.6", path = "./crates/temporal", default-features = false }
timezone_provider = { version = "0.2.6", path = "./crates/provider", default-features = false }
zoneinfo_rs = { version = "0.1.0", path = "./crates/zoneinfo", default-features = false }

# Dependencies
rustc-hash = "2.1.0"
num-traits = { version = "0.2.19", default-features = false }
iana-time-zone = "0.1.64"
log = "0.4.28"
tzif = "0.4.0"
jiff-tzdb = "0.1.4"
combine = "4.6.7"
web-time = "1.1.0"

# ICU4X
tinystr = "0.8.0"
icu_calendar = { version = "2.2.1", default-features = false }
icu_locale_core = "2.1.0"
zerovec = "0.11.0"
databake = "0.2.0"
zerotrie = "0.2.0"
writeable = "0.6.0"
zoneinfo64 = "0.3.0"
ixdtf = "0.6.4"

# Diplomat
diplomat-tool = { version = "0.16.0", default-features = false }
diplomat-runtime = { version = ">= 0.15.2, < 0.17.0", default-features = false }
diplomat = { version = "0.17.0", default-features = false }


